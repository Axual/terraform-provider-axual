provider:
  # Version is "local" for local provider, the binary path is in .terraformrc under "dev_overrides"
  # Version is a specific version like "2.4.1" for a public official registry version
  version: "local"
apiUrl: "YOUR_API_URL"
authUrl: "YOUR_AUTH_URL"
realm: "YOUR_REALM"
instanceName: "YOUR_INSTANCE_NAME"
instanceShortName: "YOUR_INSTANCE_SHORT_NAME"
groupName: "YOUR_GROUP_NAME"
userEmail: "YOUR_USER_EMAIL"
username: "YOUR_USERNAME"
password: "YOUR_PASSWORD"

# Ververica cluster test values
ververicaUrl: "YOUR_VERVERICA_URL"
ververicaApiToken: "YOUR_VERVERICA_API_TOKEN"
clusterId: "YOUR_CLUSTER_ID"

# The instance's topic pattern with everything but the topic name filled in, e.g.
# "axual-dta-tfflinkdev-". Only TestApplicationDeploymentFlinkManualTablesResource needs it, because
# a hand-written `CREATE TEMPORARY TABLE` names the real Kafka topic. Leave empty to skip that test.
resolvedTopicPrefix: ""

# The uid of an existing service account, used by TestGroupResourceServiceAccountMemberAndManager to check
# that Platform Manager resolves a bare uid to a service account in a group's member and manager
# lists. Nothing in the provider creates service accounts yet, so this is seeded by hand, and the
# credentials above must belong to a Tenant Admin: only a Tenant Admin may add a service account to
# a group. Leave empty to skip that test.
serviceAccountUid: ""

# The email address of a user who logged in once (Terraform cannot create users). TestUserResource
# imports it by email, changes its roles and puts them back at the end. Use a test user, not your
# own: a failed run can leave it without roles. Leave empty to skip that test.
testUserEmail: ""

# Set to true to run the IAM group tests (TestGroupResourceIamManaged and TestGroupDataSourceIamManaged).
# They need a Tenant Admin. They switch IAM group management on in your tenant for the run and off again at
# the end. A run that is stopped (Ctrl-C or -timeout) leaves it on and leaves the test group behind. With
# true, a user who is not a Tenant Admin, or a tenant with Axual group management off, fails the tests.
# Write true or false without quotes: a quoted value stops every test. Missing means false.
iamGroupTests: false

# Set to true for a release run: a test then fails, and does not skip, when a value it needs is empty or a YOUR_
# placeholder, so an incomplete file cannot hide tests that never ran (a package whose tests all skip still
# reports ok). Tests for a feature of a newer Platform Manager still skip. Missing means false.
strict: false

# Set to false to skip the Flink tests on purpose, also with strict: true, on a stack without Ververica. Missing
# means the Flink tests run when the Ververica values above are set.
# flinkTests: false

# Two Kafka Connect clusters already registered on one Instance-Cluster, used by the Kafka Connect
# tests (ConnectClusterDataSource, ApplicationDeploymentStateResource): one MTLS, one SASL_SCRAM.
# The tests never register them. They skip while any of these is still a YOUR_ placeholder.
connectClusterInstanceId: "YOUR_CONNECT_CLUSTER_INSTANCE_ID"
connectClusterClusterId: "YOUR_CONNECT_CLUSTER_CLUSTER_ID"
connectClusterMtlsId: "YOUR_CONNECT_CLUSTER_MTLS_ID"
connectClusterMtlsName: "YOUR_CONNECT_CLUSTER_MTLS_NAME"
connectClusterSaslId: "YOUR_CONNECT_CLUSTER_SASL_ID"
connectClusterSaslName: "YOUR_CONNECT_CLUSTER_SASL_NAME"

# A Kafka cluster that the Cluster, Instance and Instance-Cluster tests (ClusterResource,
# ClusterDataSource, InstanceResource, InstanceClusterResource and TestListClustersAndInstances in
# ListResources) register with Terraform: its bootstrap servers and PEM files of a client certificate
# that is a superuser there (an MTLS listener), the CA chain of the brokers, and the CA that signs
# application certificates (for an Instance's ca_certificates). The tests skip while any is a YOUR_
# placeholder.
kafkaBootstrapServers: "YOUR_KAFKA_BOOTSTRAP_SERVERS"
kafkaClientCertificateFile: "YOUR_KAFKA_CLIENT_CERTIFICATE_FILE"
kafkaClientPrivateKeyFile: "YOUR_KAFKA_CLIENT_PRIVATE_KEY_FILE"
kafkaTruststoreFile: "YOUR_KAFKA_TRUSTSTORE_FILE"
instanceCaCertificateFile: "YOUR_INSTANCE_CA_CERTIFICATE_FILE"

# An Apicurio registry for TestInstanceClusterResource: the URL Platform Manager uses (it ends with
# /apis/registry/v3 for Platform Manager 16.1.0 and later, /apis/registry/v2 before) and a Basic-Auth
# login. The test also creates an AVRO topic on it. It skips while any is a YOUR_ placeholder.
schemaRegistryUrl: "YOUR_SCHEMA_REGISTRY_URL"
schemaRegistryUsername: "YOUR_SCHEMA_REGISTRY_USERNAME"
schemaRegistryPassword: "YOUR_SCHEMA_REGISTRY_PASSWORD"
