provider:
  # Version is "local" for local provider, the binary path is in .terraformrc under "dev_overrides"
  # Version is a specific version like "2.4.1" for a public official registry version
  version: "local"
apiUrl: "YOUR_API_URL"
authUrl: "YOUR_AUTH_URL"
realm: "YOUR_REALM"
instanceName: "YOUR_INSTANCE_NAME"
instanceShortName: "YOUR_INSTANCE_SHORT_NAME"
groupName: "YOUR_GROUP_NAME"
userEmail: "YOUR_USER_EMAIL"
username: "YOUR_USERNAME"
password: "YOUR_PASSWORD"

# Ververica cluster test values
ververicaUrl: "YOUR_VERVERICA_URL"
ververicaApiToken: "YOUR_VERVERICA_API_TOKEN"
clusterId: "YOUR_CLUSTER_ID"

# The instance's topic pattern with everything but the topic name filled in, e.g.
# "axual-dta-tfflinkdev-". Only TestApplicationDeploymentFlinkManualTablesResource needs it, because
# a hand-written `CREATE TEMPORARY TABLE` names the real Kafka topic. Leave empty to skip that test.
resolvedTopicPrefix: ""

# The uid of an existing service account, used by TestGroupResourceServiceAccountMemberAndManager to check
# that Platform Manager resolves a bare uid to a service account in a group's member and manager
# lists. Nothing in the provider creates service accounts yet, so this is seeded by hand, and the
# credentials above must belong to a Tenant Admin: only a Tenant Admin may add a service account to
# a group. Leave empty to skip that test.
serviceAccountUid: ""

# Two Kafka Connect clusters already registered on one Instance-Cluster, used by the Kafka Connect
# tests (ConnectClusterDataSource, ApplicationDeploymentStateResource): one MTLS, one SASL_SCRAM.
# The tests never register them. They skip while any of these is still a YOUR_ placeholder.
connectClusterInstanceId: "YOUR_CONNECT_CLUSTER_INSTANCE_ID"
connectClusterClusterId: "YOUR_CONNECT_CLUSTER_CLUSTER_ID"
connectClusterMtlsId: "YOUR_CONNECT_CLUSTER_MTLS_ID"
connectClusterMtlsName: "YOUR_CONNECT_CLUSTER_MTLS_NAME"
connectClusterSaslId: "YOUR_CONNECT_CLUSTER_SASL_ID"
connectClusterSaslName: "YOUR_CONNECT_CLUSTER_SASL_NAME"
