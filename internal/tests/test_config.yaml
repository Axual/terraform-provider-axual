provider:
  # Version is "local" for local provider, the binary path is in .terraformrc under "dev_overrides"
  # Version is a specific version like "2.4.1" for a public official registry version
  version: "local"
apiUrl: "YOUR_API_URL"
authUrl: "YOUR_AUTH_URL"
realm: "YOUR_REALM"
instanceName: "YOUR_INSTANCE_NAME"
instanceShortName: "YOUR_INSTANCE_SHORT_NAME"
# Uid of an existing Instance-Cluster on the above instance, used by FlinkClusterResource tests.
instanceClusterId: "YOUR_INSTANCE_CLUSTER_ID"
groupName: "YOUR_GROUP_NAME"
userEmail: "YOUR_USER_EMAIL"
username: "YOUR_USERNAME"
password: "YOUR_PASSWORD"
# Flink cluster test values
flinkUrl: "https://vvp.example.internal/api"
flinkWorkspace: "defaultworkspace"
flinkNamespace: "default"
flinkDeploymentTarget: "default-target"
flinkApiToken: "tf-test-initial-token"
