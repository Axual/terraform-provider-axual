provider:
  # Version is "local" for local provider, the binary path is in .terraformrc under "dev_overrides"
  # Version is a specific version like "2.4.1" for a public official registry version
  version: "local"
apiUrl: "YOUR_API_URL"
authUrl: "YOUR_AUTH_URL"
realm: "YOUR_REALM"
instanceName: "YOUR_INSTANCE_NAME"
instanceShortName: "YOUR_INSTANCE_SHORT_NAME"
groupName: "YOUR_GROUP_NAME"
userEmail: "YOUR_USER_EMAIL"
username: "YOUR_USERNAME"
password: "YOUR_PASSWORD"

# Ververica cluster test values
ververicaUrl: "YOUR_VERVERICA_URL"
ververicaApiToken: "YOUR_VERVERICA_API_TOKEN"
clusterId: "YOUR_CLUSTER_ID"

# The instance's topic pattern with everything but the topic name filled in, e.g.
# "axual-dta-tfflinkdev-". Only TestApplicationDeploymentFlinkManualTablesResource needs it, because
# a hand-written `CREATE TEMPORARY TABLE` names the real Kafka topic. Leave empty to skip that test.
resolvedTopicPrefix: ""
