# Build, vet and the unit tests of both Go modules. The acceptance tests under ./internal/tests/...
# are deliberately absent: they need a reachable Axual instance and credentials in test_config.yaml.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count 1 ./internal/provider/

      # axual-webclient is a separate module, so its tests are not part of the run above.
      - name: Unit tests (axual-webclient)
        run: go test -count 1 ./...
        working-directory: axual-webclient

      - name: Documentation is up to date
        run: |
          go generate
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date - run 'go generate' and commit the result"
            exit 1
          }
