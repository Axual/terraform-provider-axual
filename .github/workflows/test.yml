# Build, vet and the unit tests of both Go modules. The acceptance tests under ./internal/tests/...
# are deliberately absent: they need a reachable Axual instance and credentials in test_config.yaml.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count 1 ./internal/provider/

      # The 386 and arm releases have a 32-bit int: this catches values that overflow it, such as a long retention_time.
      - name: Unit tests (32-bit)
        run: GOARCH=386 go test -count 1 ./internal/provider/

      # axual-webclient is a separate module, so its tests are not part of the run above.
      - name: Unit tests (axual-webclient)
        run: go test -count 1 ./...
        working-directory: axual-webclient

      # From the root, so the tests use the module versions that the provider is built with.
      - name: Unit tests (axual-webclient, provider versions)
        run: go test -count 1 axual-webclient/...

      - name: Documentation is up to date
        run: |
          go generate
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date - run 'go generate' and commit the result"
            exit 1
          }
