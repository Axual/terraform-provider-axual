version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/axual-webclient"
      - "/axual-webclient-exec"
    groups:
      actions-deps:
        patterns:
          - "*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 30
